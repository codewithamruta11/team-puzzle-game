<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unlock the Mystery</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#fff;
    min-height:100vh;
    padding:24px;
    background:linear-gradient(-45deg,#06101f,#173a8a,#6d28d9,#0ea5e9);
    background-size:400% 400%;
    animation:gradientMove 15s ease infinite;
}

.box{
    position:relative;
    max-width:1150px;
    min-height:650px;
    margin:auto;
    padding:42px;
    border-radius:28px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(16px);
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    text-align:center;
}

.hidden{
    display:none !important;
}

button{
    padding:8px 16px;
    font-size:14px;
    margin:5px;
    border:none;
    border-radius:999px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    box-shadow:0 5px 14px rgba(0,0,0,.18);
    transition:.2s ease;
}

button:hover{
    transform:translateY(-1px);
    opacity:.95;
}

.btn-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:20px;
}

.bottom-nav{
    margin-top:24px;
}

.hero-start-btn{
    padding:9px 18px;
    font-size:14px;
    border-radius:999px;
    font-weight:bold;
    animation:pulseBtn 2s infinite;
}

.round-title{
    font-size:38px;
    font-weight:800;
    margin-bottom:10px;
}

.sub-title{
    font-size:22px;
    color:rgba(255,255,255,.78);
    margin-bottom:16px;
}

/* Timer */
.timer-wrap{
    position:absolute;
    top:22px;
    right:22px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:10;
}

.timer{
    font-size:54px;
    font-weight:900;
    line-height:1;
    display:none;
    min-width:70px;
    text-align:center;
}

.timer.show{
    display:block;
}

.timer-icon-btn{
    width:56px;
    height:56px;
    border-radius:50%;
    padding:0;
    font-size:24px;
    font-weight:900;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#22c55e,#16a34a);
}

.timer-icon-btn.running{
    background:linear-gradient(135deg,#f59e0b,#d97706);
}

/* First slide */
.hero-slide{
    position:relative;
    min-height:560px;
    padding:40px 30px 22px;
    text-align:center;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.hero-title{
    margin:18px 0 14px;
    font-size:76px;
    font-weight:900;
    line-height:1.05;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 6px 20px rgba(0,0,0,.35);
    animation:fadeUp .9s ease both;
}

.hero-tagline{
    margin:0 auto 28px;
    font-size:30px;
    font-weight:700;
    color:#f8fafc;
    letter-spacing:1px;
    animation:fadeUp 1.1s ease both;
}

.hero-actions{
    margin-top:35px;
}

.hero-glow{
    position:absolute;
    top:50%;
    left:50%;
    width:420px;
    height:420px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,.05),transparent 70%);
    filter:blur(10px);
    z-index:-1;
    animation:glowMove 6s ease-in-out infinite;
}

.puzzle-icons{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin:28px auto 12px;
}

.puzzle-icon-card{
    width:88px;
    height:88px;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 12px 28px rgba(0,0,0,.20);
    backdrop-filter:blur(10px);
    animation:floatIcon 3s ease-in-out infinite;
}

.puzzle-icon-card:nth-child(2){animation-delay:.4s;}
.puzzle-icon-card:nth-child(3){animation-delay:.8s;}
.puzzle-icon-card:nth-child(4){animation-delay:1.2s;}

/* Question */
#question{
    font-size:38px;
    line-height:1.45;
    white-space:pre-line;
    margin:0;
    text-align:center;
}

.question-card{
    padding:30px 28px;
    border-radius:26px;
    background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
    border:1px solid rgba(255,255,255,.20);
    box-shadow:0 18px 42px rgba(0,0,0,.22);
    max-width:950px;
    margin:90px auto 20px;
}

/* Answer */
.answer-box{
    margin:18px auto 0;
    padding:22px 30px;
    border-radius:24px;
    background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.10));
    border:1px solid rgba(255,255,255,.22);
    display:inline-block;
    animation:fadeIn .35s ease-in-out;
    max-width:560px;
    min-width:340px;
    box-shadow:0 14px 34px rgba(0,0,0,.20);
}

.answer-img{
    width:190px;
    height:190px;
    object-fit:contain;
    display:block;
    margin:0 auto 14px;
    border-radius:26px;
    background:rgba(255,255,255,.12);
    padding:10px;
}

.answer-text{
    font-size:34px;
    font-weight:900;
    margin-top:8px;
    line-height:1.2;
}

.explanation{
    font-size:18px;
    line-height:1.65;
    margin-top:12px;
    color:#f8fafc;
    text-align:left;
    max-width:860px;
}

/* Technical round */
.options-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
    margin:18px auto 0;
    max-width:900px;
}

.option-btn{
    padding:14px 16px;
    border-radius:14px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
    font-size:16px;
    line-height:1.4;
    text-align:left;
}

.mono{
    font-family:Consolas,Menlo,monospace;
    white-space:pre-wrap;
    background:rgba(15,23,42,.35);
    padding:14px;
    border-radius:12px;
    line-height:1.45;
    text-align:left;
    overflow:auto;
    font-size:15px;
}

.table-wrap{
    overflow-x:auto;
    margin-top:14px;
}

.quiz-table{
    border-collapse:collapse;
    width:100%;
    background:rgba(255,255,255,.06);
    border-radius:14px;
    overflow:hidden;
}

.quiz-table th,
.quiz-table td{
    border:1px solid rgba(255,255,255,.18);
    padding:10px 14px;
    text-align:center;
    font-size:16px;
}

.quiz-table th{
    background:rgba(255,255,255,.18);
}

.tech-layout{
    display:flex;
    gap:18px;
    align-items:flex-start;
    justify-content:center;
    margin-top:18px;
    flex-wrap:wrap;
}

.tech-question-panel{
    flex:1 1 520px;
    min-width:300px;
    text-align:left;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    padding:18px;
}

.tech-options-panel{
    flex:1 1 330px;
    min-width:280px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    padding:18px;
    text-align:left;
}

.tech-question-text{
    font-size:22px;
    line-height:1.6;
    margin-bottom:12px;
    font-weight:800;
}

.tech-intro-box{
    font-size:64px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    text-align:center;
    margin:80px auto 28px;
    padding:24px;
}

/* Animations */
@keyframes gradientMove{
    0%{background-position:0%}
    50%{background-position:100%}
    100%{background-position:0%}
}

@keyframes fadeIn{
    from{opacity:0;transform:scale(.97)}
    to{opacity:1;transform:scale(1)}
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

@keyframes pulseBtn{
    0%{transform:scale(1)}
    50%{transform:scale(1.05)}
    100%{transform:scale(1)}
}

@keyframes glowMove{
    0%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.08)}
    100%{transform:translate(-50%,-50%) scale(1)}
}

@keyframes floatIcon{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

@media(max-width:700px){
    body{padding:12px}
    .box{padding:22px;min-height:620px}
    h1{font-size:40px!important}
    .round-title{font-size:28px}
    #question{font-size:22px}
    .question-card{margin-top:85px;padding:24px 18px}
    .timer{font-size:42px}
    .timer-wrap{top:14px;right:14px}
    button{font-size:13px;padding:8px 13px}
    .timer-icon-btn{width:52px;height:52px;font-size:22px}
    .hero-slide{min-height:530px;padding:24px 12px 10px}
    .hero-title{font-size:42px}
    .hero-tagline{font-size:22px}
    .answer-text{font-size:27px}
    .answer-img{width:145px;height:145px}
    .answer-box{min-width:260px;max-width:95%;padding:18px}
    .puzzle-icon-card{
        width:68px;
        height:68px;
        font-size:32px;
        border-radius:18px;
    }
    .tech-layout{flex-direction:column}
    .tech-question-text{font-size:18px}
    .tech-intro-box{font-size:36px}
}
</style>
</head>

<body>
<div class="box">

    <div id="intro" class="hero-slide">
        <h1 class="hero-title">Unlock the Mystery</h1>
        <h2 class="hero-tagline">Think Smart. Type Fast. Win Big.</h2>

        <div class="puzzle-icons">
            <div class="puzzle-icon-card">🔐</div>
            <div class="puzzle-icon-card">🧩</div>
            <div class="puzzle-icon-card">💡</div>

        <div class="hero-glow"></div>

        <div class="btn-row hero-actions">
            <button class="hero-start-btn" onclick="startGame()">▶ Start</button>
            <button onclick="showSlide('rules')">Next ➜</button>
        </div>
    </div>

    <div id="rules" class="hidden">
        <div class="round-title">📋 Game Rules</div>

        <div id="rulesText" style="font-size:24px;line-height:2;max-width:900px;margin:28px auto;text-align:left;padding:24px;border-radius:18px;background:rgba(255,255,255,.12);"></div>
        <div class="btn-row bottom-nav">
            <button onclick="showSlide('intro')">⬅ Back</button>
            <button onclick="showSlide('example')">Next ➜</button>

    </div>

    <div id="example" class="hidden">
        <div class="round-title">💡 Example</div>
        <div style="max-width:850px;margin:24px auto;padding:24px;border-radius:18px;background:rgba(255,255,255,.12);font-size:26px;line-height:1.8;">
            I have cities but no houses.<br>
            Rivers but no water.
        </div>
        <button onclick="showExample()">Show Answer</button>
        <div id="exampleAns"></div>
        <div class="btn-row bottom-nav">

        </div>

        <div class="btn-row bottom-nav">
            <button onclick="showAnswer()">Show Answer</button>
            <button onclick="nextQuestion()">Next ➜</button>
            <button onclick="backFromRound1()">⬅ Back</button>
        </div>

        <div id="answer"></div>
    </div>

    <div id="techIntro" class="hidden">
        <div class="tech-intro-box">Technical Round</div>
        <div class="btn-row bottom-nav">
            <button onclick="startTechnicalRound()">Start Technical Round</button>
            <button onclick="showSlide('round1')">⬅ Back</button>
        </div>
    </div>

    <div id="techRound" class="hidden">

        <div class="btn-row bottom-nav">

            <button onclick="nextTechQuestion()">Next ➜</button>
            <button onclick="backFromTechRound()">⬅ Back</button>
        </div>

        <div id="techAnswer"></div>
    </div>

    <div id="thankYou" class="hidden">

    </div>

<script>
let round1Index = 0;
let techIndex = 0;
let timerInt = null;
let timeLeft = 20;
let currentSpeech = null;

/* Improved speech function */
function cleanSpeechText(text){
    return String(text)
        .replace(/😄/g, '')
        .replace(/✅/g, '')
        .replace(/🏆/g, '')
        .replace(/⚡/g, '')
        .replace(/⏱️/g, '')
        .replace(/📖/g, '')
        .replace(/📋/g, '')
        .replace(/➜/g, '')
        .trim();
}

function speak(text){
    if(!('speechSynthesis' in window)) return;

    const speechText = cleanSpeechText(text);

    window.speechSynthesis.cancel();

    setTimeout(function(){
        currentSpeech = new SpeechSynthesisUtterance(speechText);

        currentSpeech.lang = 'en-US';
        currentSpeech.rate = 0.62;
        currentSpeech.pitch = 1;
        currentSpeech.volume = 1;

        const voices = window.speechSynthesis.getVoices();

        if(voices && voices.length > 0){
            const englishVoice =
                voices.find(v => v.lang === 'en-US') ||
                voices.find(v => v.lang === 'en-GB') ||
                voices.find(v => v.lang.startsWith('en')) ||
                voices[0];

            currentSpeech.voice = englishVoice;
        }

        window.speechSynthesis.speak(currentSpeech);
    }, 300);
}

if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){
        window.speechSynthesis.getVoices();
    };
}

function speakAnswer(answer){
    let text = String(answer);

    if(text === 'THE NUMBER 8'){
        text = 'The number eight';
    }

    if(text === 'C) 5'){
        text = 'Option C, five';
    }

    if(text === 'A) RN=4, R=4, DR=2'){
        text = 'Option A. R N equals 4, Rank equals 4, Dense Rank equals 2';
    }

    if(text === 'A) 2, 0, NULL, NULL'){
        text = 'Option A. 2, 0, null, null';
    }

    if(text === 'B) [2, 2, 2]'){
        text = 'Option B. 2, 2, 2';
    }

    if(text === 'C) True False'){
        text = 'Option C. True, False';
    }

    speak(text);
}

function showSlide(id){
    const pages = ['intro','rules','example','round1','techIntro','techRound','thankYou'];

    for(let i=0;i<pages.length;i++){
        const el = document.getElementById(pages[i]);
        if(el){
            el.classList.add('hidden');
        }
    }

    const active = document.getElementById(id);
    if(active){
        active.classList.remove('hidden');
    }

    stopTimer();

    if(id === 'rules'){
        showRules();
        speak('Please read the rules carefully.');
    }
}

function startGame(){
    speak('Unlock the Mystery. Think smart, type fast, win big.');
}

function showRules(){

        '⚡ The participant who types the correct answer first will get the point.',

        '🏆 Each correct technical question earns 5 points.'
    ];

    let html = '<div style="display:flex;flex-direction:column;gap:12px;">';

    for(let i=0;i<rulesList.length;i++){
        html += '<div style="padding:14px 16px;border-radius:14px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.14);font-size:22px;line-height:1.6;">' + rulesList[i] + '</div>';
    }

    html += '</div>';
    document.getElementById('rulesText').innerHTML = html;
}

function resetTimer(){
    stopTimer();
    timeLeft = 20;

    const display = document.getElementById('timerDisplay');
    if(display){
        display.innerText = timeLeft;
        display.classList.remove('show');
    }

    const btn = document.getElementById('timerStartBtn');
    if(btn){
        btn.innerText = '▶';
        btn.classList.remove('running');
    }
}

function toggleTimer(){
    const btn = document.getElementById('timerStartBtn');
    const display = document.getElementById('timerDisplay');

    if(display){
        display.classList.add('show');
    }

    if(timerInt){
        stopTimer();
        if(btn){
            btn.innerText = '▶';
            btn.classList.remove('running');
        }
        return;
    }

    if(timeLeft <= 0){
        timeLeft = 20;
        if(display){
            display.innerText = timeLeft;
        }
    }

    if(btn){
        btn.innerText = '⏸';
        btn.classList.add('running');
    }

    timerInt = setInterval(function(){
        timeLeft--;

        if(display){
            display.innerText = timeLeft;
        }

        if(timeLeft <= 0){
            stopTimer();

            if(display){
                display.innerText = '0';
            }

            if(btn){
                btn.innerText = '▶';
                btn.classList.remove('running');
            }
        }
    },1000);
}

function stopTimer(){
    if(timerInt){
        clearInterval(timerInt);
        timerInt = null;
    }
}
