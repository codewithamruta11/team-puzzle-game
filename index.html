<!-- Your UI, questions, images = SAME -->

<script>
let round1Index = 0;
let techIndex = 0;
let timerInt = null;
let timeLeft = 20;

/* ❌ ALL SPEECH FUNCTIONS REMOVED */

/* Navigation */
function showSlide(id){
    const pages = ['intro','rules','example','round1','techIntro','techRound','thankYou'];

    pages.forEach(p=>{
        const el = document.getElementById(p);
        if(el) el.classList.add('hidden');
    });

    document.getElementById(id).classList.remove('hidden');
    stopTimer();

    if(id === 'rules'){
        showRules();
    }
}

/* Start */
function startGame(){}

/* Rules */
function showRules(){
    const rulesList = [
        'The game contains 25 Puzzle Questions and 5 Technical Questions.',
        '⏱️ You have 20 seconds to answer each question.',
        '⚡ First correct answer gets the point.',
        '✅ Puzzle question = 1 mark.',
        '🏆 Technical question = 5 marks.'
    ];

    document.getElementById('rulesText').innerHTML =
        rulesList.map(r=>`<div style="padding:12px">${r}</div>`).join('');
}

/* Example */
function showExample(){
    document.getElementById('exampleAns').innerHTML =
        '<div class="answer-box">MAP</div>';
}

/* QUESTIONS */
const round1Questions = [
    {q:'I have many keys but open no locks.',a:'KEYBOARD',img:'keyboard'},
    {q:'I have hands but cannot clap.',a:'CLOCK',img:'clock'},
    {q:'I go up but never come down.',a:'AGE',img:'age'},
    {q:"What has a thumb and four fingers but isn't alive?",a:'GLOVE',img:'glove'},
    {q:'I am full of holes but hold water.',a:'SPONGE',img:'sponge'},
    {q:'What has one eye but cannot see?',a:'NEEDLE',img:'needle'},
    {q:'What has a head, a tail, but no body?',a:'COIN',img:'coin'}
];

/* ROUND */
function startRound1(){
    round1Index=0;
    showSlide('round1');
    loadRound1Question();
}

function loadRound1Question(){
    if(round1Index>=round1Questions.length){
        showSlide('techIntro');
        return;
    }

    const q=round1Questions[round1Index];
    document.getElementById('question').innerText =
        `Q${round1Index+1}: ${q.q}`;

    document.getElementById('answer').innerHTML='';
    resetTimer();
}

function nextQuestion(){
    round1Index++;
    loadRound1Question();
}

/* TIMER */
function resetTimer(){
    stopTimer();
    timeLeft=20;
    document.getElementById('timerDisplay').innerText=timeLeft;
}

function toggleTimer(){
    if(timerInt){
        stopTimer();
        return;
    }

    timerInt=setInterval(()=>{
        timeLeft--;
        document.getElementById('timerDisplay').innerText=timeLeft;

        if(timeLeft<=0){
            stopTimer();
        }
    },1000);
}

function stopTimer(){
    if(timerInt){
        clearInterval(timerInt);
        timerInt=null;
    }
}

/* IMAGE GENERATOR */
function createAnswerImage(type,label){
    if(type==='coin'){
        return 'data:image/svg+xml,'+encodeURIComponent(`
            <svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'>
                <circle cx='100' cy='100' r='80' fill='gold'/>
                <text x='100' y='120' font-size='40' text-anchor='middle'>¢</text>
            </svg>
        `);
    }

    if(type==='glove'){
        return 'data:image/svg+xml,'+encodeURIComponent(`
        <svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'>
            <path d='M50 100 L70 50 L90 100 L110 60 L130 100 L150 70 L160 160 L50 160 Z'
                  fill='#60a5fa'/>
        </svg>
        `);
    }

    return '';
}

/* SHOW ANSWER */
function showAnswer(){
    const q=round1Questions[round1Index];

    document.getElementById('answer').innerHTML=
        `<div class="answer-box">
            <img class="answer-img" src="${createAnswerImage(q.img="answer-text">${q.a}</div>
        </div>`;
}

/* TECH ROUND SAME */
const techQuestions=[{question:'SQL ranking',answer:'A)'}];

function startTechnicalRound(){
    techIndex=0;
    showSlide('techRound');
}

function showTechAnswer(){
    document.getElementById('techAnswer').innerHTML='Answer shown';
}
</script>
``
