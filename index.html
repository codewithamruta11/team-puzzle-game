<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unlock the Mystery</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#fff;
    min-height:100vh;
    padding:24px;
    background:linear-gradient(-45deg,#06101f,#173a8a,#6d28d9,#0ea5e9);
    background-size:400% 400%;
    animation:gradientMove 15s ease infinite;
}

.box{
    position:relative;
    max-width:1150px;
    min-height:650px;
    margin:auto;
    padding:42px;
    border-radius:28px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(16px);
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    text-align:center;
}

/* VERY IMPORTANT FIX */
.hidden{
    display:none !important;
}

button{
    padding:8px 16px;
    font-size:14px;
    margin:5px;
    border:none;
    border-radius:999px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    box-shadow:0 5px 14px rgba(0,0,0,.18);
    transition:.2s ease;
}

button:hover{
    transform:translateY(-1px);
    opacity:.95;
}

.btn-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:20px;
}

.bottom-nav{
    margin-top:24px;
}

.hero-start-btn{
    padding:9px 18px;
    font-size:14px;
    border-radius:999px;
    font-weight:bold;
    animation:pulseBtn 2s infinite;
}

.round-title{
    font-size:38px;
    font-weight:800;
    margin-bottom:10px;
}

.sub-title{
    font-size:22px;
    color:rgba(255,255,255,.78);
    margin-bottom:16px;
}

/* Timer */
.timer-wrap{
    position:absolute;
    top:22px;
    right:22px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:10;
}

.timer{
    font-size:54px;
    font-weight:900;
    line-height:1;
    display:none;
    min-width:70px;
    text-align:center;
}

.timer.show{
    display:block;
}

.timer-icon-btn{
    width:56px;
    height:56px;
    border-radius:50%;
    padding:0;
    font-size:24px;
    font-weight:900;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#22c55e,#16a34a);
}

.timer-icon-btn.running{
    background:linear-gradient(135deg,#f59e0b,#d97706);
}

/* First slide */
.hero-slide{
    position:relative;
    min-height:560px;
    padding:40px 30px 22px;
    text-align:center;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.hero-title{
    margin:18px 0 14px;
    font-size:76px;
    font-weight:900;
    line-height:1.05;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 6px 20px rgba(0,0,0,.35);
    animation:fadeUp .9s ease both;
}

.hero-tagline{
    margin:0 auto 28px;
    font-size:30px;
    font-weight:700;
    color:#f8fafc;
    letter-spacing:1px;
    animation:fadeUp 1.1s ease both;
}

.hero-actions{
    margin-top:35px;
}

.hero-glow{
    position:absolute;
    top:50%;
    left:50%;
    width:420px;
    height:420px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,.05),transparent 70%);
    filter:blur(10px);
    z-index:-1;
    animation:glowMove 6s ease-in-out infinite;
}

.puzzle-icons{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin:28px auto 12px;
}

.puzzle-icon-card{
    width:88px;
    height:88px;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 12px 28px rgba(0,0,0,.20);
    backdrop-filter:blur(10px);
    animation:floatIcon 3s ease-in-out infinite;
}

.puzzle-icon-card:nth-child(2){animation-delay:.4s;}
.puzzle-icon-card:nth-child(3){animation-delay:.8s;}
.puzzle-icon-card:nth-child(4){animation-delay:1.2s;}

/* Question */
#question{
    font-size:38px;
    line-height:1.45;
    white-space:pre-line;
    margin:0;
    text-align:center;
}

.question-card{
    padding:30px 28px;
    border-radius:26px;
    background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
    border:1px solid rgba(255,255,255,.20);
    box-shadow:0 18px 42px rgba(0,0,0,.22);
    max-width:950px;
    margin:90px auto 20px;
}

/* Answer */
.answer-box{
    margin:18px auto 0;
    padding:18px 28px;
    border-radius:22px;
    background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.10));
    border:1px solid rgba(255,255,255,.22);
    display:inline-block;
    animation:fadeIn .35s ease-in-out;
    max-width:520px;
    min-width:320px;
    box-shadow:0 14px 34px rgba(0,0,0,.20);
}

.answer-img{
    width:120px;
    height:120px;
    object-fit:contain;
    display:block;
    margin:0 auto 10px;
    border-radius:22px;
    background:rgba(255,255,255,.12);
    padding:10px;
}

.answer-text{
    font-size:30px;
    font-weight:900;
    margin-top:8px;
    line-height:1.2;
}

.explanation{
    font-size:18px;
    line-height:1.65;
    margin-top:12px;
    color:#f8fafc;
    text-align:left;
    max-width:860px;
}

/* Rules */
.rule-card-title{
    font-size:34px;
    font-weight:900;
    margin-bottom:8px;
    text-align:center;
}

.rule-card-subtitle{
    font-size:18px;
    color:rgba(255,255,255,.82);
    text-align:center;
    margin-bottom:22px;
}

/* Technical round */
.options-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
    margin:18px auto 0;
    max-width:900px;
}

.option-btn{
    padding:14px 16px;
    border-radius:14px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
    font-size:16px;
    line-height:1.4;
    text-align:left;
}

.mono{
    font-family:Consolas,Menlo,monospace;
    white-space:pre-wrap;
    background:rgba(15,23,42,.35);
    padding:14px;
    border-radius:12px;
    line-height:1.45;
    text-align:left;
    overflow:auto;
    font-size:15px;
}

.table-wrap{
    overflow-x:auto;
    margin-top:14px;
}

.quiz-table{
    border-collapse:collapse;
    width:100%;
    background:rgba(255,255,255,.06);
    border-radius:14px;
    overflow:hidden;
}

.quiz-table th,
.quiz-table td{
    border:1px solid rgba(255,255,255,.18);
    padding:10px 14px;
    text-align:center;
    font-size:16px;
}

.quiz-table th{
    background:rgba(255,255,255,.18);
}

.tech-layout{
    display:flex;
    gap:18px;
    align-items:flex-start;
    justify-content:center;
    margin-top:18px;
    flex-wrap:wrap;
}

.tech-question-panel{
    flex:1 1 520px;
    min-width:300px;
    text-align:left;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    padding:18px;
}

.tech-options-panel{
    flex:1 1 330px;
    min-width:280px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    padding:18px;
    text-align:left;
}

.tech-question-text{
    font-size:22px;
    line-height:1.6;
    margin-bottom:12px;
    font-weight:800;
}

.tech-intro-box{
    font-size:64px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    text-align:center;
    margin:80px auto 28px;
    padding:24px;
}

/* Animations */
@keyframes gradientMove{
    0%{background-position:0%}
    50%{background-position:100%}
    100%{background-position:0%}
}

@keyframes fadeIn{
    from{opacity:0;transform:scale(.97)}
    to{opacity:1;transform:scale(1)}
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

@keyframes pulseBtn{
    0%{transform:scale(1)}
    50%{transform:scale(1.05)}
    100%{transform:scale(1)}
}

@keyframes glowMove{
    0%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.08)}
    100%{transform:translate(-50%,-50%) scale(1)}
}

@keyframes floatIcon{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

@media(max-width:700px){
    body{padding:12px}
    .box{padding:22px;min-height:620px}
    h1{font-size:40px!important}
    .round-title{font-size:28px}
    #question{font-size:22px}
    .question-card{margin-top:85px;padding:24px 18px}
    .timer{font-size:42px}
    .timer-wrap{top:14px;right:14px}
    button{font-size:13px;padding:8px 13px}
    .timer-icon-btn{width:52px;height:52px;font-size:22px}
    .hero-slide{min-height:530px;padding:24px 12px 10px}
    .hero-title{font-size:42px}
    .hero-tagline{font-size:22px}
    .answer-text{font-size:26px}
    .answer-img{width:105px;height:105px}
    .answer-box{min-width:260px;max-width:95%}
    .puzzle-icon-card{
        width:68px;
        height:68px;
        font-size:32px;
        border-radius:18px;
    }
    .tech-layout{flex-direction:column}
    .tech-question-text{font-size:18px}
    .tech-intro-box{font-size:36px}
}
</style>
</head>

<body>
<div class="box">

    <div id="intro" class="hero-slide">
        <h1 class="hero-title">Unlock the Mystery</h1>
        <h2 class="hero-tagline">Think Smart. Type Fast. Win Big.</h2>

        <div class="puzzle-icons">
            <div class="puzzle-icon-card">🔐</div>
            <div class="puzzle-icon-card">🧩</div>
            <div class="puzzle-icon-card">💡</div>
            <div class="puzzle-icon-card">🏆</div>
        </div>

        <div class="hero-glow"></div>

        <div class="btn-row hero-actions">
            <button class="hero-start-btn" onclick="startGame()">▶ Start</button>
            <button onclick="showSlide('rules')">Next ➜</button>
        </div>
    </div>

    <div id="rules" class="hidden">
        <div class="round-title">📋 Game Rules</div>
        <h2>Please read the rules carefully</h2>
        <div id="rulesText" style="font-size:24px;line-height:2;max-width:900px;margin:28px auto;text-align:left;padding:24px;border-radius:18px;background:rgba(255,255,255,.12);"></div>
        <div class="btn-row bottom-nav">
            <button onclick="showSlide('intro')">⬅ Back</button>
            <button onclick="showSlide('example')">Next ➜</button>
        </div>
    </div>

    <div id="example" class="hidden">
        <div class="round-title">💡 Example</div>
        <div style="max-width:850px;margin:24px auto;padding:24px;border-radius:18px;background:rgba(255,255,255,.12);font-size:26px;line-height:1.8;">
            I have cities but no houses.<br>
            Rivers but no water.
        </div>
        <button onclick="showExample()">Show Answer</button>
        <div id="exampleAns"></div>
        <div class="btn-row bottom-nav">
            <button onclick="showSlide('rules')">⬅ Back</button>
            <button onclick="startRound1()">Start Game</button>
        </div>
    </div>

    <div id="round1" class="hidden">
        <div class="timer-wrap">
            <div class="timer" id="timerDisplay">20</div>
            <button id="timerStartBtn" class="timer-icon-btn" onclick="toggleTimer()">▶</button>
        </div>

        <div class="question-card">
            <h2 id="question"></h2>
        </div>

        <div class="btn-row bottom-nav">
            <button onclick="showAnswer()">Show Answer</button>
            <button onclick="nextQuestion()">Next ➜</button>
            <button onclick="backFromRound1()">⬅ Back</button>
        </div>

        <div id="answer"></div>
    </div>

    <div id="techIntro" class="hidden">
        <div class="tech-intro-box">Technical Round</div>
        <div class="btn-row bottom-nav">
            <button onclick="startTechnicalRound()">Start Technical Round</button>
            <button onclick="showSlide('round1')">⬅ Back</button>
        </div>
    </div>

    <div id="techRound" class="hidden">
        <div class="sub-title">Question <span id="techCounter"></span> / <span id="techTotal"></span></div>

        <div class="tech-layout">
            <div class="tech-question-panel">
                <div id="techQuestionText" class="tech-question-text"></div>
                <div id="techTable"></div>
            </div>

            <div class="tech-options-panel">
                <div id="techOptions"></div>
            </div>
        </div>

        <div class="btn-row bottom-nav">
            <button onclick="showTechAnswer()">Show Answer</button>
            <button onclick="nextTechQuestion()">Next ➜</button>
            <button onclick="backFromTechRound()">⬅ Back</button>
        </div>

        <div id="techAnswer"></div>
    </div>

    <div id="thankYou" class="hidden">
        <h1 style="font-size:72px;margin:120px 0 30px;">Thank You</h1>
    </div>

</div>

<script>
let round1Index = 0;
let techIndex = 0;
let timerInt = null;
let timeLeft = 20;

function speak(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.85;
    utter.pitch = 1;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
}

function showSlide(id){
    const pages = ['intro','rules','example','round1','techIntro','techRound','thankYou'];

    for(let i=0;i<pages.length;i++){
        const el = document.getElementById(pages[i]);
        if(el){
            el.classList.add('hidden');
        }
    }

    const active = document.getElementById(id);
    if(active){
        active.classList.remove('hidden');
    }

    stopTimer();

    if(id === 'rules'){
        showRules();
        speak('Please read the rules carefully.');
    }
}

function startGame(){
    speak('Unlock the Mystery. Think smart, type fast, win big.');
}

function showRules(){
    const rulesList = [
        'The game contains 20 Puzzle Questions and 5 Technical Questions.',
        '⏱️ You have 20 seconds to answer each question.',
        '📖 Read each question carefully before submitting your answer in chat.',
        '✅ Each correct answer earns 1 point.'
    ];

    let html = '<div class="rule-card-title">🎮 Game Rules</div>';
    html += '<div class="rule-card-subtitle">Read the instructions carefully before starting the challenge.</div>';
    html += '<div style="display:flex;flex-direction:column;gap:12px;">';

    for(let i=0;i<rulesList.length;i++){
        html += '<div style="padding:14px 16px;border-radius:14px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.14);font-size:22px;line-height:1.6;">' + rulesList[i] + '</div>';
    }

    html += '</div>';
    document.getElementById('rulesText').innerHTML = html;
}

/* Correct answer image generator */
function createAnswerImage(icon){
    const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">' +
        '<defs>' +
        '<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#38bdf8"/>' +
        '<stop offset="45%" stop-color="#818cf8"/>' +
        '<stop offset="100%" stop-color="#c084fc"/>' +
        '</linearGradient>' +
        '<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">' +
        '<feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>' +
        '</filter>' +
        '</defs>' +
        '<rect width="240" height="240" rx="42" fill="url(#g)"/>' +
        '<circle cx="120" cy="120" r="74" fill="rgba(255,255,255,0.22)"/>' +
        '<circle cx="120" cy="120" r="54" fill="rgba(255,255,255,0.18)"/>' +
        '<text x="120" y="128" font-size="78" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">' + icon + '</text>' +
        '</svg>';

    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}

function showExample(){
    const img = createAnswerImage('🗺️');
    document.getElementById('exampleAns').innerHTML =
        '<div class="answer-box">' +
        '<img class="answer-img" src="' + img + '" alt="MAP">' +
        '<div class="answer-text">MAP</div>' +
        '</div>';

    speak('Map');
}

const round1Questions = [
    {q:'I have many keys but open no locks. What am I?', a:'KEYBOARD', icon:'⌨️'},
    {q:'I have hands but cannot clap. What am I?', a:'CLOCK', icon:'🕒'},
    {q:'I go up but never come down. What am I?', a:'AGE', icon:'🎂'},
    {q:'I have a face and two hands but no arms or legs. What am I?', a:'CLOCK', icon:'⏰'},
    {q:'I am full of holes but can still hold water. What am I?', a:'SPONGE', icon:'🧽'},
    {q:'What has one eye but cannot see?', a:'NEEDLE', icon:'🪡'},
    {q:'What gets wetter the more it dries?', a:'TOWEL', icon:'🧺'},
    {q:'What has a neck but no head?', a:'BOTTLE', icon:'🍾'},
    {q:'What has teeth but cannot bite?', a:'COMB', icon:'💇'},
    {q:'What comes down but never goes up?', a:'RAIN', icon:'🌧️'},
    {q:'I have many windows but no house. What am I?', a:'MICROSOFT WINDOWS', icon:'🪟'},
    {q:'I am a bug that everyone wants to find, but no one wants in production. What am I?', a:'SOFTWARE BUG', icon:'🐞'},
    {q:'I connect millions of computers but cannot shake hands. What am I?', a:'INTERNET', icon:'🌐'},
    {q:'I store memories but have no brain. What am I?', a:'HARD DRIVE', icon:'💾'},
    {q:'The more of me you delete, the faster things often become. What am I?', a:'CACHE', icon:'⚡'},
    {q:'I protect your account, but people often forget me. What am I?', a:'PASSWORD', icon:'🔐'},
    {q:'I live in the cloud but never get wet. What am I?', a:'CLOUD STORAGE', icon:'☁️'},
    {q:'I translate human instructions into something computers understand. What am I?', a:'PROGRAMMING LANGUAGE', icon:'💻'},
    {q:'I can run thousands of applications but never move an inch. What am I?', a:'SERVER', icon:'🖥️'},
    {q:'I am always debugging your code, but I never write any. What am I?', a:'DEVELOPER', icon:'👩‍💻'}
];

function startRound1(){
    round1Index = 0;
    showSlide('round1');
    loadRound1Question();
}

function loadRound1Question(){
    if(round1Index >= round1Questions.length){
        showSlide('techIntro');
        return;
    }

    const q = round1Questions[round1Index];

    document.getElementById('question').innerText =
        'Q' + (round1Index + 1) + ': ' + q.q;

    document.getElementById('answer').innerHTML = '';
    resetTimer();
}

function nextQuestion(){
    round1Index++;
    loadRound1Question();
}

function backFromRound1(){
    if(round1Index > 0){
        round1Index--;
        loadRound1Question();
    }else{
        showSlide('example');
    }
}

function resetTimer(){
    stopTimer();
    timeLeft = 20;

    const display = document.getElementById('timerDisplay');
    if(display){
        display.innerText = timeLeft;
        display.classList.remove('show');
    }

    const btn = document.getElementById('timerStartBtn');
    if(btn){
        btn.innerText = '▶';
        btn.classList.remove('running');
    }
}

function toggleTimer(){
    const btn = document.getElementById('timerStartBtn');
    const display = document.getElementById('timerDisplay');

    if(display){
        display.classList.add('show');
    }

    if(timerInt){
        stopTimer();
        if(btn){
            btn.innerText = '▶';
            btn.classList.remove('running');
        }
        return;
    }

    if(timeLeft <= 0){
        timeLeft = 20;
        if(display){
            display.innerText = timeLeft;
        }
    }

    if(btn){
        btn.innerText = '⏸';
        btn.classList.add('running');
    }

    timerInt = setInterval(function(){
        timeLeft--;

        if(display){
            display.innerText = timeLeft;
        }

        if(timeLeft <= 0){
            stopTimer();

            if(display){
                display.innerText = '0';
            }

            if(btn){
                btn.innerText = '▶';
                btn.classList.remove('running');
            }
        }
    },1000);
}

function stopTimer(){
    if(timerInt){
        clearInterval(timerInt);
        timerInt = null;
    }
}

function showAnswer(){
    const q = round1Questions[round1Index];
    const img = createAnswerImage(q.icon);

    document.getElementById('answer').innerHTML =
        '<div class="answer-box">' +
        '<img class="answer-img" src="' + img + '" alt="' + q.a + '">' +
        '<div class="answer-text">' + q.a + '</div>' +
        '</div>';

    speak(q.a);
}

const techQuestions = [
    {
        question:'SQL – LEFT JOIN Nightmare',
        tableHtml:`
            <div class="table-wrap">
                <table class="quiz-table">
                    <tr><th>Table A</th></tr>
                    <tr><td>ID</td></tr>
                    <tr><td>1</td></tr>
                    <tr><td>2</td></tr>
                </table>

                <br>

                <table class="quiz-table">
                    <tr><th>Table B</th></tr>
                    <tr><td>ID</td></tr>
                    <tr><td>1</td></tr>
                    <tr><td>1</td></tr>
                    <tr><td>1</td></tr>
                    <tr><td>2</td></tr>
                    <tr><td>2</td></tr>
                </table>
            </div>

            <br>

            <div class="mono">SELECT COUNT(*)
FROM A
LEFT JOIN B
ON A.ID = B.ID;</div>
        `,
        options:['A) 2','B) 3','C) 5','D) 7'],
        answer:'C) 5',
        explanation:'LEFT JOIN returns one row for each match. ID=1 matches 3 rows in B and ID=2 matches 2 rows in B. So total rows = 3 + 2 = 5.'
    },
    {
        question:'SQL – Ranking Functions',
        tableHtml:`
            <div class="table-wrap">
                <table class="quiz-table">
                    <tr><th>Salary</th></tr>
                    <tr><td>100</td></tr>
                    <tr><td>100</td></tr>
                    <tr><td>100</td></tr>
                    <tr><td>90</td></tr>
                </table>
            </div>

            <br>

            <div class="mono">SELECT Salary,
       ROW_NUMBER() OVER(ORDER BY Salary DESC) RN,
       RANK() OVER(ORDER BY Salary DESC) R,
       DENSE_RANK() OVER(ORDER BY Salary DESC) DR
FROM Employee;</div>
        `,
        options:[
            'A) RN=4, R=4, DR=2',
            'B) RN=2, R=2, DR=2',
            'C) RN=4, R=2, DR=2',
            'D) RN=4, R=4, DR=4'
        ],
        answer:'A) RN=4, R=4, DR=2',
        explanation:'ROW_NUMBER gives unique numbers. RANK skips positions after ties. DENSE_RANK does not skip. Salary 90 gets RN=4, R=4, DR=2.'
    },
    {
        question:'SQL – COUNT, SUM and AVG with NULL',
        tableHtml:`
            <div class="table-wrap">
                <table class="quiz-table">
                    <tr><th>Value</th></tr>
                    <tr><td>NULL</td></tr>
                    <tr><td>NULL</td></tr>
                </table>
            </div>

            <br>

            <div class="mono">SELECT
COUNT(*),
COUNT(Value),
SUM(Value),
AVG(Value)
FROM T;</div>
        `,
        options:[
            'A) 2, 0, NULL, NULL',
            'B) 2, 2, 0, 0',
            'C) 0, 0, 0, NULL',
            'D) 2, 0, 0, 0'
        ],
        answer:'A) 2, 0, NULL, NULL',
        explanation:'COUNT(*) counts all rows. COUNT(Value) ignores NULL values. SUM and AVG return NULL when all values are NULL.'
    },
    {
        question:'Python – Late Binding in Lambda',
        tableHtml:`
            <div class="mono">funcs = []

for i in range(3):
    funcs.append(lambda: i)

print([f() for f in funcs])</div>
        `,
        options:[
            'A) [0, 1, 2]',
            'B) [2, 2, 2]',
            'C) [3, 3, 3]',
            'D) Error'
        ],
        answer:'B) [2, 2, 2]',
        explanation:'Python lambdas capture the variable, not the value at each loop step. After the loop ends, i is 2, so all functions return 2.'
    },
    {
        question:'Python – Difference Between == and is',
        tableHtml:`
            <div class="mono">a = [1, 2]
b = [1, 2]

print(a == b, a is b)</div>
        `,
        options:[
            'A) True True',
            'B) False False',
            'C) True False',
            'D) False True'
        ],
        answer:'C) True False',
        explanation:'== compares values. is compares memory identity. Both lists have the same values, but they are different objects.'
    }
];

function startTechnicalRound(){
    techIndex = 0;
    showSlide('techRound');
    loadTechQuestion();
}

function loadTechQuestion(){
    if(techIndex >= techQuestions.length){
        showSlide('thankYou');
        return;
    }

    const q = techQuestions[techIndex];

    document.getElementById('techCounter').innerText = techIndex + 1;
    document.getElementById('techTotal').innerText = techQuestions.length;

    document.getElementById('techQuestionText').innerText =
        'Question ' + (techIndex + 1) + ': ' + q.question;

    document.getElementById('techTable').innerHTML = q.tableHtml;

    let optHtml = '<div class="options-grid">';

    for(let i=0;i<q.options.length;i++){
        optHtml += '<div class="option-btn">' + q.options[i] + '</div>';
    }

    optHtml += '</div>';

    document.getElementById('techOptions').innerHTML = optHtml;
    document.getElementById('techAnswer').innerHTML = '';
}

function nextTechQuestion(){
    techIndex++;
    loadTechQuestion();
}

function backFromTechRound(){
    if(techIndex > 0){
        techIndex--;
        loadTechQuestion();
    }else{
        showSlide('techIntro');
    }
}

function showTechAnswer(){
    const q = techQuestions[techIndex];

    document.getElementById('techAnswer').innerHTML =
        '<div class="answer-box"><div class="answer-text">' +
        q.answer +
        '</div><div class="explanation">' +
        q.explanation +
        '</div></div>';

    speak(q.answer);
}
</script>
