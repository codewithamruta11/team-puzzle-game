<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gantec Puzzle Arena</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#fff;
    min-height:100vh;
    padding:24px;
    background:linear-gradient(-45deg,#06101f,#173a8a,#6d28d9,#0ea5e9);
    background-size:400% 400%;
    animation:gradientMove 15s ease infinite;
}
.box{
    max-width:1150px;
    margin:auto;
    padding:42px;
    border-radius:28px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(16px);
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    text-align:center;
}
.hidden{display:none;}
button{
    padding:12px 22px;
    font-size:17px;
    margin:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    box-shadow:0 5px 14px rgba(0,0,0,.18);
    transition:.2s ease;
}
button:hover{
    transform:translateY(-1px);
    opacity:.95;
}
.round-title{
    font-size:38px;
    font-weight:800;
    margin-bottom:10px;
}
.sub-title{
    font-size:22px;
    color:rgba(255,255,255,.78);
    margin-bottom:16px;
}
.timer{
    font-size:96px;
    font-weight:900;
    margin:18px 0 6px;
    text-align:center;
    line-height:1;
}
.timer-icon-btn{
    width:62px;
    height:62px;
    border-radius:50%;
    padding:0;
    font-size:28px;
    font-weight:900;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#22c55e,#16a34a);
}
.timer-icon-btn.running{
    background:linear-gradient(135deg,#f59e0b,#d97706);
}
#question{
    font-size:38px;
    line-height:1.45;
    white-space:pre-line;
    margin:18px 0;
    text-align:center;
}
.answer-box{
    margin:22px auto 0;
    padding:22px;
    border-radius:22px;
    background:rgba(255,255,255,.16);
    display:inline-block;
    animation:fadeIn .35s ease-in-out;
    max-width:100%;
    min-width:70%;
}
.answer-text{
    font-size:36px;
    font-weight:900;
    margin-top:16px;
    line-height:1.2;
}
.explanation{
    font-size:18px;
    line-height:1.65;
    margin-top:12px;
    color:#f8fafc;
    text-align:left;
    max-width:860px;
}
.options-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
    margin:18px auto 0;
    max-width:900px;
}
.option-btn{
    padding:14px 16px;
    border-radius:14px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
    font-size:16px;
    line-height:1.4;
    text-align:left;
}
.mono{
    font-family:Consolas,Menlo,monospace;
    white-space:pre-wrap;
    background:rgba(15,23,42,.35);
    padding:14px;
    border-radius:12px;
    line-height:1.45;
    text-align:left;
    overflow:auto;
    font-size:15px;
}
.table-wrap{
    overflow-x:auto;
    margin-top:14px;
}
.quiz-table{
    border-collapse:collapse;
    width:100%;
    background:rgba(255,255,255,.06);
    border-radius:14px;
    overflow:hidden;
}
.quiz-table th,
.quiz-table td{
    border:1px solid rgba(255,255,255,.18);
    padding:10px 14px;
    text-align:center;
    font-size:16px;
}
.quiz-table th{
    background:rgba(255,255,255,.18);
}
.hero-slide{
    position:relative;
    padding:92px 30px 80px;
    text-align:center;
    overflow:hidden;
}
.hero-badge{
    display:inline-block;
    padding:10px 22px;
    border-radius:999px;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:15px;
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
    backdrop-filter:blur(8px);
    animation:fadeDown .8s ease both;
}
.hero-title{
    margin:24px 0 14px;
    font-size:72px;
    font-weight:900;
    line-height:1.05;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 6px 20px rgba(0,0,0,.35);
    animation:fadeUp .9s ease both;
}
.hero-tagline{
    margin:0 auto 34px;
    font-size:30px;
    font-weight:700;
    color:#f8fafc;
    letter-spacing:1px;
    animation:fadeUp 1.1s ease both;
}
.hero-start-btn{
    padding:14px 28px;
    font-size:18px;
    border-radius:12px;
    font-weight:bold;
    animation:pulseBtn 2s infinite;
}
.hero-glow{
    position:absolute;
    top:50%;
    left:50%;
    width:420px;
    height:420px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,.05),transparent 70%);
    filter:blur(10px);
    z-index:-1;
    animation:glowMove 6s ease-in-out infinite;
}
.btn-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:18px;
}
.tech-layout{
    display:flex;
    gap:18px;
    align-items:flex-start;
    justify-content:center;
    margin-top:18px;
    flex-wrap:wrap;
}
.tech-question-panel{
    flex:1 1 520px;
    min-width:300px;
    text-align:left;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    padding:18px;
}
.tech-options-panel{
    flex:1 1 330px;
    min-width:280px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    padding:18px;
    text-align:left;
}
.tech-question-text{
    font-size:22px;
    line-height:1.6;
    margin-bottom:12px;
    font-weight:800;
}
.tech-intro-box{
    font-size:64px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    text-align:center;
    margin:28px auto;
    padding:24px;
}
@keyframes gradientMove{
    0%{background-position:0%}
    50%{background-position:100%}
    100%{background-position:0%}
}
@keyframes fadeIn{
    from{opacity:0;transform:scale(.97)}
    to{opacity:1;transform:scale(1)}
}
@keyframes fadeDown{
    from{opacity:0;transform:translateY(-20px)}
    to{opacity:1;transform:translateY(0)}
}
@keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}
@keyframes pulseBtn{
    0%{transform:scale(1)}
    50%{transform:scale(1.05)}
    100%{transform:scale(1)}
}
@keyframes glowMove{
    0%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.08)}
    100%{transform:translate(-50%,-50%) scale(1)}
}
@media(max-width:700px){
    body{padding:12px}
    .box{padding:22px}
    h1{font-size:40px!important}
    .round-title{font-size:28px}
    #question{font-size:22px}
    .timer{font-size:64px}
    button{font-size:15px;padding:10px 14px}
    .timer-icon-btn{width:52px;height:52px;font-size:22px}
    .hero-title{font-size:42px}
    .hero-tagline{font-size:22px}
    .answer-text{font-size:28px}
    .tech-layout{flex-direction:column}
    .tech-question-text{font-size:18px}
    .tech-intro-box{font-size:36px}
}
</style>
</head>

<body>
<div class="box">

    <div id="intro" class="hero-slide">
        <div class="hero-badge">WELCOME TO</div>
        <h1 class="hero-title">GANTEC PUZZLE ARENA</h1>
        <h2 class="hero-tagline">Fast Minds. Smart Answers. Big Fun.</h2>
        <div class="hero-glow"></div>
        <div class="btn-row">
            <button class="hero-start-btn" onclick="startGame()">▶ START</button>
            <button onclick="showSlide('rules')">Next ➜</button>
        </div>
    </div>

    <div id="rules" class="hidden">
        <div class="round-title">📋 GAME RULES</div>
        <h2>Please read the rules carefully</h2>
        <div id="rulesText" style="font-size:24px;line-height:2;max-width:900px;margin:28px auto;text-align:left;padding:24px;border-radius:18px;background:rgba(255,255,255,.12);"></div>
        <div class="btn-row">
            <button onclick="showSlide('intro')">⬅ Back</button>
            <button onclick="showSlide('example')">Next ➜</button>
        </div>
    </div>

    <div id="example" class="hidden">
        <div class="round-title">💡 EXAMPLE</div>
        <div style="max-width:850px;margin:24px auto;padding:24px;border-radius:18px;background:rgba(255,255,255,.12);font-size:26px;line-height:1.8;">
            I have cities but no houses.<br>
            Rivers but no water.
        </div>
        <button onclick="showExample()">Show Answer</button>
        <div id="exampleAns"></div>
        <div class="btn-row">
            <button onclick="showSlide('rules')">⬅ Back</button>
            <button onclick="startRound1()">Start Game</button>
        </div>
    </div>

    <div id="round1" class="hidden">
        <h2 id="question"></h2>
        <div class="timer" id="timerDisplay">20</div>
        <button id="timerStartBtn" class="timer-icon-btn" onclick="toggleTimer()">▶</button>

        <div class="btn-row">
            <button onclick="showAnswer()">Show Answer</button>
            <button onclick="nextQuestion()">Next</button>
            <button onclick="backFromRound1()">⬅ Back</button>
        </div>
        <div id="answer"></div>
    </div>

    <div id="techIntro" class="hidden">
        <div class="tech-intro-box">TECHNICAL ROUND</div>
        <div class="btn-row">
            <button onclick="startTechnicalRound()">Start Technical Round</button>
            <button onclick="showSlide('round1')">⬅ Back</button>
        </div>
    </div>

    <div id="techRound" class="hidden">
        <div class="sub-title">Question <span id="techCounter"></span> / <span id="techTotal"></span></div>

        <div class="tech-layout">
            <div class="tech-question-panel">
                <div id="techQuestionText" class="tech-question-text"></div>
                <div id="techTable"></div>
            </div>

            <div class="tech-options-panel">
                <div id="techOptions"></div>
            </div>
        </div>

        <div class="btn-row">
            <button onclick="showTechAnswer()">Show Answer</button>
            <button onclick="nextTechQuestion()">Next</button>
            <button onclick="backFromTechRound()">⬅ Back</button>
        </div>

        <div id="techAnswer"></div>
    </div>

    <div id="thankYou" class="hidden">
        <h1 style="font-size:72px;margin:40px 0;">Thank you</h1>
    </div>

</div>

<script>
let round1Index = 0;
let techIndex = 0;
let timerInt = null;
let timeLeft = 20;

function speak(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.85;
    utter.pitch = 1;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
}

function showSlide(id){
    const pages = ['intro','rules','example','round1','techIntro','techRound','thankYou'];

    for(let i=0;i<pages.length;i++){
        const el = document.getElementById(pages[i]);
        if(el) el.classList.add('hidden');
    }

    const active = document.getElementById(id);
    if(active) active.classList.remove('hidden');

    stopTimer();

    if(id === 'rules'){
        showRules();
        speak('Please read the rules carefully.');
    }
}

function startGame(){
    speak('Welcome to Gantec Puzzle Arena. Fast minds, smart answers, big fun.');
}

function showRules(){
    const rulesList = [
        'The game contains 30 Puzzle Questions and 5 Technical Questions.',
        '⏱️ You have 20 seconds to answer each question.',
        '📖 Read each question carefully before submitting your answer in chat.',
        '✅ Each correct answer earns 1 point.',
        '💡 A separate example slide is provided before the main game starts.',
        '🏁 After the puzzle round, the technical round will begin.'
    ];

    let html = '<div style="font-size:30px;font-weight:800;margin-bottom:18px;text-align:center;">🎮 Game Rules</div>';
    html += '<div style="display:flex;flex-direction:column;gap:12px;">';

    for(let i=0;i<rulesList.length;i++){
        html += '<div style="padding:14px 16px;border-radius:14px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.14);font-size:22px;line-height:1.6;">' + rulesList[i] + '</div>';
    }

    html += '</div>';
    document.getElementById('rulesText').innerHTML = html;
}

function showExample(){
    document.getElementById('exampleAns').innerHTML =
        '<div class="answer-box"><div class="answer-text">MAP 🗺️</div></div>';
    speak('Map');
}

const round1Questions = [
    {q:'I have many keys but open no locks. What am I?',a:'KEYBOARD'},
    {q:'I can run thousands of applications but never move an inch. What am I?',a:'SERVER'},
    {q:'I store memories but have no brain. What am I?',a:'HARD DRIVE'},
    {q:'I carry my home everywhere.\nSlowly but confidently.\nWhat am I?',a:'TORTOISE'},
    {q:'Palaces fill my streets.\nCamels are not far away.\nMy color made me famous.\nWho am I?',a:'JAIPUR'},
    {q:'I am worn in many styles.\nAcross many states.\nYet remain timeless.\nWhat am I?',a:'SAREE'},
    {q:'I decide your quick-thinking pace.\nIn your game I rule the race.',a:'TIMER'},
    {q:'I protect doors you cannot see,\nHackers fear getting past me.',a:'FIREWALL'},
    {q:'I repeat the same work again,\nTill logic says I should refrain.',a:'LOOP'},
    {q:'I find mistakes hidden in code,\nAnd lighten the developer’s load.',a:'DEBUGGER'},
    {q:'I rise each year but never fall,\nNo ladder needed after all.',a:'AGE'},
    {q:'A room with no door and no wall,\nStill people love me after all.',a:'MUSHROOM'},
    {q:'I shine by night, disappear by noon,\nSilent beauty in the sky soon.',a:'MOON'},
    {q:'I can be broken.\nWithout being touched.',a:'PROMISE'},
    {q:'I can be stolen.\nWithout touching anything.',a:'HEART'},
    {q:'Invisible but always near,\nWhen I’m gone everyone feels fear.',a:'WIFI'},
    {q:'I define goals for every team,\nSuccess begins within my theme.',a:'TARGET'},
    {q:'I come once a year with hope and cheer,\nEmployees wait for me throughout the year.',a:'APPRAISAL'},
    {q:'I give you a break from office chair,\nRequested in portal with extra care.',a:'LEAVE'},
    {q:'I teach you skills to grow each day,\nLearning always leads the way.',a:'TRAINING'},
    {q:'I am small and spinning.\nYet I appear at the center of pride.\nTwenty-four spokes define me.\nWhat am I?',a:'ASHOKA CHAKRA'},
    {q:'I am full of holes but can still hold water. What am I?',a:'SPONGE'},
    {q:'I wear white through day and night.\nA king built me for love.\nMillions visit me every year.\nWho am I?',a:'TAJ MAHAL'},
    {q:'There is a word in the English language in which the first two letters signify a male, the first three letters signify a female, the first four signify a great man, and the whole word, a great woman. What is the word?',a:'HEROINE'},
    {q:'Turn me on my side, and I am everything. Cut me in half, and I am nothing. What am I?',a:'NUMBER 8'},
    {q:'I lead company vision and goal,\nTaking the highest leadership role.',a:'CEO'},
    {q:'I judge your progress through the year,\nManagers review me with care.',a:'PERFORMANCE'},
    {q:'I sit between user and machine,\nMaking everything look clean.',a:'INTERFACE'},
    {q:'I break programs without a sound,\nDevelopers search till I’m found.',a:'BUG'},
    {q:'I can be kept.\nWithout being held.',a:'PROMISE'}
];

function startRound1(){
    round1Index = 0;
    showSlide('round1');
    loadRound1Question();
}

function loadRound1Question(){
    if(round1Index >= round1Questions.length){
        showSlide('techIntro');
        return;
    }

    const q = round1Questions[round1Index];

    document.getElementById('question').innerText =
        'Q' + (round1Index + 1) + ': ' + q.q;

    document.getElementById('answer').innerHTML = '';
    resetTimer();
}

function nextQuestion(){
    round1Index++;
    loadRound1Question();
}

function backFromRound1(){
    if(round1Index > 0){
        round1Index--;
        loadRound1Question();
    }else{
        showSlide('example');
    }
}

function resetTimer(){
    stopTimer();
    timeLeft = 20;
    document.getElementById('timerDisplay').innerText = timeLeft;

    const btn = document.getElementById('timerStartBtn');
    if(btn){
        btn.innerText = '▶';
        btn.classList.remove('running');
    }
}

function toggleTimer(){
    const btn = document.getElementById('timerStartBtn');

    if(timerInt){
        stopTimer();
        if(btn){
            btn.innerText = '▶';
            btn.classList.remove('running');
        }
        return;
    }

    if(timeLeft <= 0){
        timeLeft = 20;
        document.getElementById('timerDisplay').innerText = timeLeft;
    }

    if(btn){
        btn.innerText = '⏸';
        btn.classList.add('running');
    }

    timerInt = setInterval(function(){
        timeLeft--;
        document.getElementById('timerDisplay').innerText = timeLeft;

        if(timeLeft <= 0){
            stopTimer();
            document.getElementById('timerDisplay').innerText = '0';

            if(btn){
                btn.innerText = '▶';
                btn.classList.remove('running');
            }
        }
    },1000);
}

function stopTimer(){
    if(timerInt){
        clearInterval(timerInt);
        timerInt = null;
    }
}

function showAnswer(){
    const q = round1Questions[round1Index];

    document.getElementById('answer').innerHTML =
        '<div class="answer-box"><div class="answer-text">' + q.a + '</div></div>';

    speak(q.a);
}

const techQuestions = [
    {
        question:'SQL – LEFT JOIN Nightmare',
        tableHtml:`
            <div class="table-wrap">
                <table class="quiz-table">
                    <tr><th>Table A</th></tr>
                    <tr><td>ID</td></tr>
                    <tr><td>1</td></tr>
                    <tr><td>2</td></tr>
                </table>

                <br>

                <table class="quiz-table">
                    <tr><th>Table B</th></tr>
                    <tr><td>ID</td></tr>
                    <tr><td>1</td></tr>
                    <tr><td>1</td></tr>
                    <tr><td>1</td></tr>
                    <tr><td>2</td></tr>
                    <tr><td>2</td></tr>
                </table>
            </div>

            <br>

            <div class="mono">SELECT COUNT(*)
FROM A
LEFT JOIN B
ON A.ID = B.ID;</div>
        `,
        options:['A) 2','B) 3','C) 5','D) 7'],
        answer:'C) 5',
        explanation:'LEFT JOIN returns one row for each match. ID=1 matches 3 rows in B and ID=2 matches 2 rows in B. So total rows = 3 + 2 = 5.'
    },
    {
        question:'SQL – Ranking Functions',
        tableHtml:`
            <div class="table-wrap">
                <table class="quiz-table">
                    <tr><th>Salary</th></tr>
                    <tr><td>100</td></tr>
                    <tr><td>100</td></tr>
                    <tr><td>100</td></tr>
                    <tr><td>90</td></tr>
                </table>
            </div>

            <br>

            <div class="mono">SELECT Salary,
       ROW_NUMBER() OVER(ORDER BY Salary DESC) RN,
       RANK() OVER(ORDER BY Salary DESC) R,
       DENSE_RANK() OVER(ORDER BY Salary DESC) DR
FROM Employee;</div>
        `,
        options:[
            'A) RN=4, R=4, DR=2',
            'B) RN=2, R=2, DR=2',
            'C) RN=4, R=2, DR=2',
            'D) RN=4, R=4, DR=4'
        ],
        answer:'A) RN=4, R=4, DR=2',
        explanation:'ROW_NUMBER gives unique numbers. RANK skips positions after ties. DENSE_RANK does not skip. Salary 90 gets RN=4, R=4, DR=2.'
    },
    {
        question:'SQL – COUNT, SUM and AVG with NULL',
        tableHtml:`
            <div class="table-wrap">
                <table class="quiz-table">
                    <tr><th>Value</th></tr>
                    <tr><td>NULL</td></tr>
                    <tr><td>NULL</td></tr>
                </table>
            </div>

            <br>

            <div class="mono">SELECT
COUNT(*),
COUNT(Value),
SUM(Value),
AVG(Value)
FROM T;</div>
        `,
        options:[
            'A) 2, 0, NULL, NULL',
            'B) 2, 2, 0, 0',
            'C) 0, 0, 0, NULL',
            'D) 2, 0, 0, 0'
        ],
        answer:'A) 2, 0, NULL, NULL',
        explanation:'COUNT(*) counts all rows. COUNT(Value) ignores NULL values. SUM and AVG return NULL when all values are NULL.'
    },
    {
        question:'Python – Late Binding in Lambda',
        tableHtml:`
            <div class="mono">funcs = []

for i in range(3):
    funcs.append(lambda: i)

print([f() for f in funcs])</div>
        `,
        options:[
            'A) [0, 1, 2]',
            'B) [2, 2, 2]',
            'C) [3, 3, 3]',
            'D) Error'
        ],
        answer:'B) [2, 2, 2]',
        explanation:'Python lambdas capture the variable, not the value at each loop step. After the loop ends, i is 2, so all functions return 2.'
    },
    {
        question:'Python – Difference Between == and is',
        tableHtml:`
            <div class="mono">a = [1, 2]
b = [1, 2]

print(a == b, a is b)</div>
        `,
        options:[
            'A) True True',
            'B) False False',
            'C) True False',
            'D) False True'
        ],
        answer:'C) True False',
        explanation:'== compares values. is compares memory identity. Both lists have the same values, but they are different objects.'
    }
];

function startTechnicalRound(){
    techIndex = 0;
    showSlide('techRound');
    loadTechQuestion();
}

function loadTechQuestion(){
    if(techIndex >= techQuestions.length){
        showSlide('thankYou');
        return;
    }

    const q = techQuestions[techIndex];

    document.getElementById('techCounter').innerText = techIndex + 1;
    document.getElementById('techTotal').innerText = techQuestions.length;

    document.getElementById('techQuestionText').innerText =
        'Question ' + (techIndex + 1) + ': ' + q.question;

    document.getElementById('techTable').innerHTML = q.tableHtml;

    let optHtml = '<div class="options-grid">';

    for(let i=0;i<q.options.length;i++){
        optHtml += '<div class="option-btn">' + q.options[i] + '</div>';
    }

    optHtml += '</div>';

    document.getElementById('techOptions').innerHTML = optHtml;
    document.getElementById('techAnswer').innerHTML = '';
}

function nextTechQuestion(){
    techIndex++;
    loadTechQuestion();
}

function backFromTechRound(){
    if(techIndex > 0){
        techIndex--;
        loadTechQuestion();
    }else{
        showSlide('techIntro');
    }
}

function showTechAnswer(){
    const q = techQuestions[techIndex];

    document.getElementById('techAnswer').innerHTML =
